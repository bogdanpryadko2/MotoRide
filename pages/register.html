<div class="register-wrap">
    <h2>Создать аккаунт</h2>
    <p class="register-sub">
        Присоединяйся к сообществу райдеров<br />
        или <a href="#" onclick="switchPage('auth'); return false;">войди в существующий</a>
    </p>

    <form onsubmit="event.preventDefault(); alert('Аккаунт создан! Добро пожаловать!');">
        <div class="form-group">
            <label for="reg-name">Имя и фамилия</label>
            <input type="text" id="reg-name" placeholder="Алексей Райдеров" />
        </div>

        <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="rider@moto.ru" />
        </div>

        <div class="form-group">
            <label for="reg-password">Пароль</label>
            <input type="password" id="reg-password" placeholder="минимум 8 символов" />
        </div>

        <div class="form-group">
            <label for="reg-password-confirm">Подтверждение пароля</label>
            <input type="password" id="reg-password-confirm" placeholder="повторите пароль" />
        </div>

        <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>

    <div class="auth-footer">
        Уже есть аккаунт? <a href="#" onclick="switchPage('auth'); return false;">Войти</a>
    </div>
</div>
